# ============================================================
# Vocero CRM — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:  cp .env.example .env  →  rellenar  →  docker compose up -d --build
# ============================================================
services:
  app:
    build: .
    restart: unless-stopped
    # PID 1 = tini: el `sh -c` del CMD recibe SIGTERM y el servidor termina lo
    # que está procesando (webhooks ya respondidos con 200) en vez de morir
    # con SIGKILL a los 10 s en cada rilascio.
    init: true
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      # 009 — Embedded Signup (coexistence). Sin ellas el botón no aparece.
      META_APP_ID: ${META_APP_ID:-}
      META_ES_CONFIG_ID: ${META_ES_CONFIG_ID:-}
      WAPI_BASE_URL: ${WAPI_BASE_URL:-}
      WAPI_API_KEY: ${WAPI_API_KEY:-}
      WAPI_ORG_IDS: ${WAPI_ORG_IDS:-}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      EXPORT_API_KEY: ${EXPORT_API_KEY:-}
      AUTOMATIONS_TICK_MS: ${AUTOMATIONS_TICK_MS:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # Páginas legales (PR #3): borrador visible hasta LEGAL_TEXTS_REVIEWED=true.
      LEGAL_TEXTS_REVIEWED: ${LEGAL_TEXTS_REVIEWED:-}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      # 008 — Adjuntos en un volumen: sin él quedaban dentro del contenedor
      # (default ./.dev-media) y se perdían en cada rebuild. El Dockerfile ya
      # prepara /data/media con el dueño correcto.
      MEDIA_DIR: /data/media
    volumes:
      - vocero_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vocero_media:
  vocero_pg:
  vocero_caddy_data:
  vocero_caddy_config:
